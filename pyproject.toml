[project]
name = "agent-automl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youssef Ennagui", email = "youssefennagui@usmba.ac.ma" }
]
requires-python = ">=3.13"
dependencies = [
    "ipython>=9.16.1",
    "joblib>=1.5.3",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
agent-automl = "agent_automl:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
